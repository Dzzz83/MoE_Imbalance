expert: balanced_softmax
seed: 78
device: auto
model:
  arch: resnet32
  num_classes: 100
loss:
  tau: null
  alpha: null
optimiser:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0002
  nesterov: false
schedule:
  epochs: 200
  warmup_epochs: 5
  decay_epochs:
  - 160
  - 180
  decay_factors:
  - 0.01
  - 0.0001
data:
  root: ./data
  imbalance_ratio: 100.0
  batch_size: 128
  num_workers: 2
  pin_memory: true
checkpoint:
  dir: ./checkpoints
