# Logit-Adjusted Loss (LA) expert — Menon et al., ICLR 2021
#
# Recipe source : LDAM-DRW `cifar_train.py` schedule (shared CIFAR-LT protocol).
#                 The official logit-adjustment repo trains CIFAR-100-LT for 1419
#                 epochs with its own step schedule; that is ~7x the budget of the
#                 other experts and would make the ensemble comparison unfair, so
#                 LA is deliberately trained on the shared 200-epoch / 160-180
#                 protocol with tau held at the published value of 1.0.
#                 (Recorded deviation — see docs/specs/training-protocol.md.)
# Data          : the canonical CIFAR-100-LT IR=100 training set (10,847 samples).
# Reported model: the final-epoch checkpoint.

expert: logit_adjusted
seed: 0
device: auto

model:
  arch: resnet32
  num_classes: 100

loss:
  tau: 1.0             # logit offset tau * log(pi_y); 0.0 would recover CE

optimiser:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 2.0e-4
  nesterov: false

schedule:
  epochs: 200
  warmup_epochs: 5
  decay_epochs: [160, 180]
  decay_factors: [0.01, 0.0001]

data:
  root: ./data
  imbalance_ratio: 100.0
  batch_size: 128
  num_workers: 2
  pin_memory: true

checkpoint:
  dir: ./checkpoints
  save_from_epoch: 160
  save_every: 20
